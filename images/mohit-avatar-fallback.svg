<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101a" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f1526" />
    </linearGradient>
    <linearGradient id="mGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#avatarBg)"/>

  <!-- Neural Net Background Connections -->
  <g opacity="0.25">
    <line x1="80" y1="120" x2="220" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="220" y1="180" x2="300" y2="100" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="300" y1="100" x2="480" y2="140" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="480" y1="140" x2="520" y2="300" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="120" y1="400" x2="200" y2="520" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="200" y1="520" x2="400" y2="560" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="400" y1="560" x2="500" y2="440" stroke="#8b5cf6" stroke-width="1.5"/>
    
    <!-- Dots on vertices -->
    <circle cx="80" cy="120" r="3" fill="#38bdf8"/>
    <circle cx="220" cy="180" r="4" fill="#818cf8"/>
    <circle cx="300" cy="100" r="3" fill="#c084fc"/>
    <circle cx="480" cy="140" r="4" fill="#a855f7"/>
    <circle cx="520" cy="300" r="3" fill="#38bdf8"/>
    <circle cx="120" cy="400" r="4" fill="#3b82f6"/>
    <circle cx="200" cy="520" r="3" fill="#6366f1"/>
    <circle cx="400" cy="560" r="4" fill="#8b5cf6"/>
    <circle cx="500" cy="440" r="3" fill="#c084fc"/>
  </g>

  <!-- Glowing Outer Halo -->
  <circle cx="300" cy="310" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  <circle cx="300" cy="310" r="135" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="310" r="110" fill="rgba(59,130,246,0.06)"/>

  <!-- Center Core Monogram Shield -->
  <g transform="translate(300, 310)">
    <!-- Central Hexagon / Orb -->
    <circle cx="0" cy="0" r="90" fill="rgba(15,23,42,0.8)" stroke="url(#mGlow)" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Large M Monogram -->
    <path d="M -42 42 L -42 -38 L 0 8 L 42 -38 L 42 42" 
          stroke="url(#mGlow)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Data Flow Particles around M -->
  <g opacity="0.8">
    <circle cx="240" cy="230" r="2.5" fill="#38bdf8"/>
    <circle cx="370" cy="220" r="3" fill="#c084fc"/>
    <circle cx="390" cy="380" r="2.5" fill="#60a5fa"/>
    <circle cx="210" cy="370" r="3" fill="#a78bfa"/>
  </g>

  <!-- Identity Card Lower Overlay -->
  <g transform="translate(300, 520)">
    <!-- Badge Box -->
    <rect x="-180" y="0" width="360" height="150" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="0" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
      Mohit Mundke
    </text>
    
    <text x="0" y="56" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      GOOGLE STUDENT AMBASSADOR
    </text>
    
    <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
      AI &amp; Data Science · Pune, India
    </text>

    <!-- Bronze Badge Pill -->
    <g transform="translate(0, 106)">
      <rect x="-75" y="0" width="150" height="26" rx="13" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
      <text x="0" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">
        ★ GID: 5314 · BRONZE
      </text>
    </g>
  </g>
</svg>
