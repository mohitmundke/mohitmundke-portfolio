<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohit Mundke — AI &amp; Data Science Builder · AWS Leader · Student Innovator</title>
  <meta name="description" content="Official story-driven portfolio of Mohit Mundke — 2nd Year Artificial Intelligence &amp; Data Science student at DYPCOEI Pune, AWS Student Builder Group Leader, and Google Gemini AI Ambassador." />
  <meta name="author" content="Mohit Mundke" />
  <link rel="canonical" href="https://mohitmundkeco.vercel.app/" />
  <meta property="og:title" content="Mohit Mundke — AI &amp; Data Science Builder · AWS Leader" />
  <meta property="og:description" content="Exploring AI, cloud, design and technology while building products, communities and experiences." />
  <meta property="og:url" content="https://mohitmundkeco.vercel.app/" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" type="image/png" href="./favicon.png" />

  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bgDark: '#05070a',
            panelDark: '#080c14',
            surfaceDark: '#0d121f',
            awsOrange: '#FF9900',
            awsAmber: '#FFA724',
            techBlue: '#38bdf8',
            techPurple: '#818cf8',
            techViolet: '#a855f7',
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-dark: #05070a;
      --panel-dark: #080c14;
      --aws-orange: #FF9900;
      --tech-blue: #38bdf8;
      --tech-purple: #818cf8;
      --font-display: 'Space Grotesk', sans-serif;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #05070a;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      selection-background-color: rgba(255, 153, 0, 0.25);
    }

    ::selection {
      background: rgba(255, 153, 0, 0.3);
      color: #ffffff;
    }

    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Editorial typography helper */
    .tracking-editorial {
      letter-spacing: -0.04em;
    }

    /* Ambient background grid */
    .bg-tech-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    .bg-aws-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 153, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 153, 0, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Glassmorphism styling */
    .glass-panel {
      background: rgba(12, 18, 30, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(10, 15, 26, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(14, 21, 37, 0.75);
    }

    .glass-card-aws {
      background: rgba(14, 18, 28, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 153, 0, 0.15);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card-aws:hover {
      border-color: rgba(255, 153, 0, 0.45);
      box-shadow: 0 16px 40px -10px rgba(255, 153, 0, 0.15);
      transform: translateY(-2px);
    }

    /* Buttons */
    .btn-editorial-primary {
      background: #ffffff;
      color: #05070a;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-editorial-primary:hover {
      background: #f1f5f9;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
      transform: translateY(-1.5px);
    }

    .btn-editorial-aws {
      background: linear-gradient(135deg, #FF9900 0%, #FF7700 100%);
      color: #05070a;
      font-weight: 700;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-editorial-aws:hover {
      box-shadow: 0 0 35px rgba(255, 153, 0, 0.45);
      transform: translateY(-2px);
    }

    .btn-editorial-outline {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f1f5f9;
      transition: all 0.3s ease;
    }

    .btn-editorial-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1.5px);
    }

    /* Minimal custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #05070a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e2638;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Smooth pulse glow animations */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    .animate-subtle-pulse {
      animation: subtlePulse 6s ease-in-out infinite;
    }

    @keyframes lineProgress {
      0% { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }
  </style>
</head>
<body class="bg-[#05070a] text-[#f1f5f9] antialiased selection:bg-[#FF9900]/25 selection:text-white overflow-x-hidden">
  <div id="root">
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;">
      Mohit Mundke — AI &amp; Data Science Builder, AWS Leader, and Innovator
    </h1>
  </div>

  <!-- Embedded Image Assets (Zero-404 Image Delivery) -->
  <script src="./image-assets.js"></script>

  <!-- Main Application Script -->
  <script type="text/babel" data-presets="react" src="./app.js"></script>
</body>
</html>
