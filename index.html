<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOHIT MUNDKE — Creative Developer, AI Builder &amp; AWS Community Leader</title>
  <meta name="description" content="Immersive digital portfolio of Mohit Mundke — AI &amp; Data Science builder at DYPCOEI Pune, AWS Student Builder Group Leader, and Google Gemini AI Ambassador." />
  <meta name="author" content="Mohit Mundke" />
  <link rel="canonical" href="https://mohitmundkeco.vercel.app/" />
  <meta property="og:title" content="MOHIT MUNDKE — Creative Developer &amp; AI Builder" />
  <meta property="og:description" content="I build at the intersection of AI, Cloud &amp; Design." />
  <meta property="og:url" content="https://mohitmundkeco.vercel.app/" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" type="image/png" href="./favicon.png" />

  <!-- Google Fonts: Syne, Space Grotesk, Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            syne: ['Syne', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bgDark: '#050505',
            panelDark: '#09090b',
            surfaceDark: '#0d0d11',
            awsOrange: '#FF9900',
            awsAmber: '#FFA724',
            techCyan: '#38bdf8',
            techViolet: '#818cf8',
            googleBlue: '#4285F4',
            googleRed: '#EA4335',
            googleYellow: '#FBBC05',
            googleGreen: '#34A853',
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-dark: #050505;
      --aws-orange: #FF9900;
      --tech-cyan: #38bdf8;
      --font-display: 'Space Grotesk', sans-serif;
      --font-syne: 'Syne', sans-serif;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      background-color: #050505;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: rgba(255, 153, 0, 0.35);
      color: #ffffff;
    }

    .font-syne { font-family: 'Syne', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Monumental Editorial Type */
    .text-huge-display {
      font-size: clamp(3.8rem, 11.5vw, 12rem);
      line-height: 0.88;
      letter-spacing: -0.055em;
    }

    .text-scene-title {
      font-size: clamp(2.4rem, 7.5vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
    }

    /* Tactile Film Grain / Noise Overlay */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Minimal Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #050505;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF9900;
    }

    /* Subtle Animated Horizon Grid */
    .bg-horizon-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 72px 72px;
    }

    .bg-aws-dark {
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 153, 0, 0.08), transparent 60%),
        linear-gradient(to right, rgba(255, 153, 0, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 153, 0, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
    }

    /* Smooth clip-path animations */
    .clip-reveal-hidden {
      clip-path: inset(100% 0 0 0);
      transform: translateY(40px);
      opacity: 0;
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .clip-reveal-active {
      clip-path: inset(0 0 0 0);
      transform: translateY(0);
      opacity: 1;
    }

    /* Cursor styling (desktop only) */
    @media (pointer: fine) {
      body {
        cursor: none;
      }
      a, button, [role="button"], input, textarea {
        cursor: none;
      }
    }
  </style>
</head>
<body class="bg-[#050505] text-[#f1f5f9] antialiased selection:bg-[#FF9900]/30 selection:text-white">
  
  <!-- Subtle Filmic Noise Texture -->
  <div class="noise-overlay"></div>

  <!-- Root Mount -->
  <div id="root"></div>

  <!-- Embedded Image Assets (Zero-404 Image Delivery) -->
  <script src="./image-assets.js"></script>

  <!-- Main Application Script -->
  <script type="text/babel" data-presets="react" src="./app.js"></script>
</body>
</html>
