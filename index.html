<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohit Mundke | AI &amp; Data Science Student · Google Student Ambassador · Aspiring Software Engineer</title>
  <meta name="description" content="Official portfolio of Mohit Mundke — AI &amp; Data Science Engineering Student at DYPCOEI Pune, Google Student Ambassador (GID: 5314), and Aspiring Software Engineer." />
  <meta name="author" content="Mohit Mundke" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="/favicon.png" />

  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bgDark: '#030508',
            panelDark: '#070c18',
            accentBlue: '#3b82f6',
            accentViolet: '#7c3aed',
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

  <style>
    /* Custom Design Tokens & Utility Classes */
    :root {
      --bg-primary: #030508;
      --bg-secondary: #070c18;
      --accent-blue: #3b82f6;
      --accent-violet: #7c3aed;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      background-color: #030508;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cta-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #7c3aed 100%);
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cta-primary:hover {
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
      transform: translateY(-2px);
    }
    .cta-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      transition: all 0.3s ease;
    }
    .cta-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .tech-tag {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 1.5rem 60px 1.5rem;
    }

    /* ─── Hero Cinematic Stage ─── */
    .hero-cinematic-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    .hero-ambient-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, rgba(59, 130, 246, 0.15) 50%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }
    .hero-orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    .hero-orbit-1 { width: 340px; height: 340px; }
    .hero-orbit-2 { width: 420px; height: 420px; }
    .hero-orbit-3 { width: 490px; height: 490px; }
    .orbit-node {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 10px #60a5fa;
    }
    .node-1 { top: 15%; left: 10%; }
    .node-2 { bottom: 20%; right: 15%; }
    .hero-arch-frame {
      position: relative;
      width: 320px;
      height: 420px;
      border-radius: 200px 200px 24px 24px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.6), rgba(124, 58, 237, 0.6), rgba(6, 182, 212, 0.4));
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(124, 58, 237, 0.25);
      z-index: 5;
    }
    .hero-arch-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 197px 197px 21px 21px;
      overflow: hidden;
      background: #070c18;
    }
    .hero-portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.5s ease;
    }
    .hero-float-badge {
      position: absolute;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(7, 12, 24, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      animation: float 4s ease-in-out infinite;
    }
    .hero-badge-tr { top: 30px; right: -15px; }
    .hero-badge-bl { bottom: 25px; left: -20px; animation-delay: 2s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .whatsapp-float-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .whatsapp-float-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.6);
      background: #20ba59;
    }

    /* Scroll reveal animations */
    .reveal, .reveal-up {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .revealed {
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
    }

    /* ─── Education Vertical Timeline System ─── */
    .timeline-track-base {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .timeline-track-active {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: linear-gradient(to bottom, #8b5cf6, #3b82f6, #06b6d4);
      transform-origin: top;
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
    }
    .timeline-active-glow-tip {
      position: absolute;
      left: 50%;
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 15px #06b6d4, 0 0 25px #8b5cf6;
      transform: translate3d(-50%, 0, 0);
      pointer-events: none;
      z-index: 15;
    }
    .timeline-node-wrap {
      position: absolute;
      top: 32px;
      transform: translate(-50%, -50%);
      z-index: 20;
    }
    .timeline-node-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #080c18;
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #ffffff;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .timeline-node-circle.active, .timeline-node-circle:hover {
      border-color: #a78bfa;
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      box-shadow: 0 0 25px rgba(167, 139, 250, 0.7);
      transform: scale(1.1);
    }
    .timeline-node-pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid rgba(139, 92, 246, 0.4);
      animation: pulse-ring 2.5s infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .timeline-card-wrapper {
      opacity: 1;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .timeline-card-glass {
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .timeline-card-glass:hover, .timeline-card-glass.active {
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.15);
      transform: translateY(-3px);
    }
    .corner-accent {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(139, 92, 246, 0.5);
      pointer-events: none;
    }
    .corner-tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; border-top-left-radius: 1.5rem; }
    .corner-tr { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; border-top-right-radius: 1.5rem; }
    .corner-bl { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; border-bottom-left-radius: 1.5rem; }
    .corner-br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; border-bottom-right-radius: 1.5rem; }
    .tech-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #030508; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>

</html>
